<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOGWALK — visual prototype</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0a0c10; }
  #fog { position: absolute; inset: 0; z-index: 500; pointer-events: none; }

  .hud { position: absolute; z-index: 1100; color: #fff; font-family: system-ui, "Segoe UI", sans-serif; user-select: none; }
  #title {
    top: 14px; left: 16px;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 28px; letter-spacing: 2px;
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,.9);
  }
  #title small { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 1px; color: #9fb2c8; display: block; margin-top: -2px; }
  #stats {
    top: 66px; left: 16px;
    background: rgba(10,12,16,.82); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; line-height: 1.75; min-width: 150px;
    backdrop-filter: blur(4px);
  }
  #stats b { color: #7fd4ff; font-variant-numeric: tabular-nums; }
  #controls { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; }
  #controls button {
    background: rgba(10,12,16,.85); color: #e8eef6;
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    padding: 9px 12px; font-size: 13px; cursor: pointer; text-align: left;
    backdrop-filter: blur(4px);
  }
  #controls button:hover { background: rgba(30,36,46,.9); }
  #controls button.active { outline: 2px solid #7fd4ff; color: #7fd4ff; }
  #hint {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(10,12,16,.85); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 8px 18px; font-size: 13px; color: #c8d4e2;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fog"></canvas>

<div class="hud" id="title">FOGWALK<small>VISUAL PROTOTYPE</small></div>
<div class="hud" id="stats">
  Walked <b id="stDist">0.00</b> km<br>
  Revealed <b id="stArea">0.000</b> km²<br>
  Cells <b id="stCells">0</b>
</div>
<div class="hud" id="controls">
  <button id="btnLocate">📍 My location</button>
  <button id="btnPaint">🖌 Paint mode</button>
  <button id="btnReset">↺ Reset fog</button>
</div>
<div class="hud" id="hint">Click the map to walk there · drag to pan · scroll to zoom</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  // ---- Tunables (these map 1:1 onto real-app parameters) ----
  const CELL_DEG   = 0.00022;  // visited-cell grid step, ~24 m of latitude (stand-in for H3 res 11)
  const REVEAL_M   = 55;       // fog reveal radius around the walked path, meters
  const MARK_M     = 12;       // drop a visited cell every N meters along the path
  const FOG_COLOR  = 'rgba(5, 7, 10, 0.90)'; // locked-world tint; faint map hints show through
  const LS_KEY     = 'fogwalk_v1';

  // ---- Custom dark style: Apple-Maps-dark-inspired, full color control ----
  // This is the same approach the real app will use (MapLibre + vector tiles).
  const STYLE = {
    version: 8,
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {
      omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#141a23' } },
      { id: 'landcover-green', type: 'fill', source: 'omt', 'source-layer': 'landcover',
        filter: ['in', ['get', 'class'], ['literal', ['grass', 'wood', 'scrub', 'farmland']]],
        paint: { 'fill-color': '#1f3d2b' } },
      { id: 'landuse-green', type: 'fill', source: 'omt', 'source-layer': 'landuse',
        filter: ['in', ['get', 'class'], ['literal', ['park', 'garden', 'grass', 'pitch', 'playground', 'recreation_ground', 'cemetery', 'allotments', 'village_green']]],
        paint: { 'fill-color': '#1f3d2b' } },
      { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park',
        paint: { 'fill-color': '#1f3d2b' } },
      { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
        paint: { 'fill-color': '#2a5f7e' } },
      { id: 'waterway', type: 'line', source: 'omt', 'source-layer': 'waterway',
        paint: { 'line-color': '#2a5f7e',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.8, 16, 3] } },
      { id: 'buildings', type: 'fill', source: 'omt', 'source-layer': 'building',
        minzoom: 13,
        paint: { 'fill-color': '#1c2431' } },
      { id: 'aeroway', type: 'line', source: 'omt', 'source-layer': 'aeroway',
        paint: { 'line-color': '#3d4655',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1, 16, 6] } },
      { id: 'road-path', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['path', 'track']]],
        minzoom: 13,
        paint: { 'line-color': '#404b5c', 'line-dasharray': [2, 1.5],
                 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 0.5, 18, 2] } },
      { id: 'road-service', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['service', 'raceway']]],
        minzoom: 13,
        paint: { 'line-color': '#48546a',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 0.6, 18, 4] } },
      { id: 'road-minor', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['minor', 'unclassified', 'residential', 'living_street', 'pedestrian']]],
        paint: { 'line-color': '#5f6f88',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.5, 13, 1.4, 16, 4, 18, 10] } },
      { id: 'road-tertiary', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['tertiary']]],
        paint: { 'line-color': '#75879f',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.8, 13, 2, 16, 5, 18, 12] } },
      { id: 'road-secondary', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['secondary']]],
        paint: { 'line-color': '#8b9cb4',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1, 13, 2.5, 16, 6, 18, 14] } },
      { id: 'road-primary', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['primary']]],
        paint: { 'line-color': '#a7b7cc',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 1, 13, 3, 16, 7, 18, 16] } },
      { id: 'road-major', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk']]],
        paint: { 'line-color': '#c9d4e2',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 1.2, 13, 3.5, 16, 8, 18, 18] } },
      { id: 'rail', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['==', ['get', 'class'], 'rail'],
        minzoom: 12,
        paint: { 'line-color': '#333e4e', 'line-dasharray': [3, 3],
                 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 0.8, 18, 2.5] } },
      { id: 'boundary', type: 'line', source: 'omt', 'source-layer': 'boundary',
        filter: ['<=', ['get', 'admin_level'], 6],
        paint: { 'line-color': '#2e3c50', 'line-dasharray': [3, 2], 'line-width': 1 } },
      { id: 'road-label', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name',
        minzoom: 14,
        layout: { 'symbol-placement': 'line', 'text-field': ['get', 'name'],
                  'text-font': ['Noto Sans Regular'], 'text-size': 11 },
        paint: { 'text-color': '#aebfd4', 'text-halo-color': '#0d1219', 'text-halo-width': 1.4 } },
      { id: 'place-minor', type: 'symbol', source: 'omt', 'source-layer': 'place',
        filter: ['in', ['get', 'class'], ['literal', ['suburb', 'neighbourhood', 'quarter', 'village']]],
        minzoom: 11,
        layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                  'text-size': 12, 'text-transform': 'uppercase', 'text-letter-spacing': 0.1 },
        paint: { 'text-color': '#8fa1b8', 'text-halo-color': '#0d1219', 'text-halo-width': 1.4 } },
      { id: 'place-major', type: 'symbol', source: 'omt', 'source-layer': 'place',
        filter: ['in', ['get', 'class'], ['literal', ['city', 'town']]],
        layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                  'text-size': 16, 'text-transform': 'uppercase', 'text-letter-spacing': 0.15 },
        paint: { 'text-color': '#e4ebf4', 'text-halo-color': '#0d1219', 'text-halo-width': 1.6 } }
    ]
  };

  const map = new maplibregl.Map({
    container: 'map',
    style: STYLE,
    center: [4.8952, 52.3702], // Amsterdam default
    zoom: 14,
    attributionControl: { compact: false },
    pitchWithRotate: false
  });
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  // ---- State ----
  const cells = new Map();            // "i_j" -> [lat, lng] center of a visited cell
  let walker = null;                  // current player position {lat, lng}
  let target = null;                  // where we're walking to
  let distanceM = 0;                  // total meters walked
  let lastMark = null;                // last position where a cell was dropped
  let paintMode = false;
  let dirty = true;                   // fog canvas needs redraw
  let saveTimer = null;

  const canvas = document.getElementById('fog');
  const ctx = canvas.getContext('2d');

  // ---- Geometry helpers ----
  function distM(a, b) { // haversine, meters
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const s = Math.sin(dLat / 2) ** 2 +
              Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function metersPerPixel() {
    const lat = map.getCenter().lat * Math.PI / 180;
    return 40075016.686 * Math.abs(Math.cos(lat)) / Math.pow(2, map.getZoom() + 9);
  }
  function cellKey(lat, lng) {
    return Math.round(lat / CELL_DEG) + '_' + Math.round(lng / CELL_DEG);
  }
  function revealAt(pos) {
    const k = cellKey(pos.lat, pos.lng);
    if (!cells.has(k)) {
      const [i, j] = k.split('_').map(Number);
      cells.set(k, [i * CELL_DEG, j * CELL_DEG]);
      dirty = true;
      save();
    }
  }

  // ---- Persistence ----
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const c = map.getCenter();
        localStorage.setItem(LS_KEY, JSON.stringify({
          cells: [...cells.keys()],
          dist: distanceM,
          walker: walker ? [walker.lat, walker.lng] : null,
          view: [c.lat, c.lng, map.getZoom()]
        }));
      } catch (e) { /* storage full or unavailable — prototype keeps running in-memory */ }
    }, 800);
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      for (const k of d.cells) {
        const [i, j] = k.split('_').map(Number);
        cells.set(k, [i * CELL_DEG, j * CELL_DEG]);
      }
      distanceM = d.dist || 0;
      if (d.walker) walker = { lat: d.walker[0], lng: d.walker[1] };
      if (d.view) map.jumpTo({ center: [d.view[1], d.view[0]], zoom: d.view[2] });
      return true;
    } catch (e) { return false; }
  }

  // ---- Fog rendering ----
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const el = map.getContainer();
    canvas.width = el.clientWidth * dpr;
    canvas.height = el.clientHeight * dpr;
    canvas.style.width = el.clientWidth + 'px';
    canvas.style.height = el.clientHeight + 'px';
    dirty = true;
  }
  function drawFog() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // Locked world
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = FOG_COLOR;
    ctx.fillRect(0, 0, w, h);

    // Punch soft holes where we've walked
    ctx.globalCompositeOperation = 'destination-out';
    const r = Math.max(REVEAL_M / metersPerPixel(), 3);
    const pad = r + 2;
    for (const [, [lat, lng]] of cells) {
      const p = map.project([lng, lat]);
      if (p.x < -pad || p.y < -pad || p.x > w + pad || p.y > h + pad) continue;
      const g = ctx.createRadialGradient(p.x, p.y, r * 0.45, p.x, p.y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Player marker
    if (walker) {
      ctx.globalCompositeOperation = 'source-over';
      const p = map.project([walker.lng, walker.lat]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(127,212,255,0.25)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#0a0c10';
      ctx.stroke();
    }
  }

  // ---- Stats HUD ----
  const stDist = document.getElementById('stDist');
  const stArea = document.getElementById('stArea');
  const stCells = document.getElementById('stCells');
  function updateStats() {
    const lat = map.getCenter().lat * Math.PI / 180;
    const cellAreaM2 = (CELL_DEG * 111320) * (CELL_DEG * 111320 * Math.cos(lat));
    stDist.textContent = (distanceM / 1000).toFixed(2);
    stArea.textContent = (cells.size * cellAreaM2 / 1e6).toFixed(3);
    stCells.textContent = cells.size;
  }

  // ---- Walking simulation ----
  function markAlong(pos) {
    if (!lastMark || distM(pos, lastMark) >= MARK_M) {
      revealAt(pos);
      lastMark = pos;
    }
  }
  function setWalker(pos, countDistance) {
    if (walker && countDistance) distanceM += distM(walker, pos);
    walker = { lat: pos.lat, lng: pos.lng };
    markAlong(walker);
    dirty = true;
    updateStats();
  }
  function walkTo(pos) { target = { lat: pos.lat, lng: pos.lng }; }

  function tick() {
    if (target && walker) {
      const remaining = distM(walker, target);
      // Sim speed scales with zoom so the reveal feels snappy at any level
      const step = Math.max(metersPerPixel() * 6, 5);
      if (remaining <= step) {
        setWalker(target, true);
        revealAt(walker);
        target = null;
        save();
      } else {
        const f = step / remaining;
        setWalker({
          lat: walker.lat + (target.lat - walker.lat) * f,
          lng: walker.lng + (target.lng - walker.lng) * f
        }, true);
      }
    }
    if (dirty) { drawFog(); dirty = false; }
    requestAnimationFrame(tick);
  }

  // ---- Interactions ----
  map.on('click', e => {
    if (paintMode) { setWalker(e.lngLat, true); return; }
    if (!walker) { setWalker(e.lngLat, false); return; }
    walkTo(e.lngLat);
  });
  map.on('mousemove', e => {
    if (paintMode && e.originalEvent.buttons === 1) setWalker(e.lngLat, true);
  });
  map.on('move', () => { dirty = true; });
  map.on('moveend', () => { save(); });
  map.on('resize', resizeCanvas);
  window.addEventListener('resize', resizeCanvas);

  document.getElementById('btnPaint').addEventListener('click', function () {
    paintMode = !paintMode;
    this.classList.toggle('active', paintMode);
    if (paintMode) map.dragPan.disable(); else map.dragPan.enable();
    document.getElementById('hint').textContent = paintMode
      ? 'Paint mode: hold the mouse button and scrub to reveal'
      : 'Click the map to walk there · drag to pan · scroll to zoom';
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    cells.clear(); distanceM = 0; lastMark = null; target = null;
    localStorage.removeItem(LS_KEY);
    dirty = true; updateStats();
  });
  document.getElementById('btnLocate').addEventListener('click', () => {
    if (!navigator.geolocation) return alert('Geolocation not available in this browser.');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.jumpTo({ center: [ll.lng, ll.lat], zoom: 15 });
        setWalker(ll, false);
        save();
      },
      err => alert('Could not get location: ' + err.message +
        '\n(Geolocation needs http://localhost or https — it is blocked on file:// pages.)')
    );
  });

  // ---- Boot ----
  const restored = load();
  resizeCanvas();
  if (!restored || !walker) {
    const c = map.getCenter();
    setWalker({ lat: c.lat, lng: c.lng }, false);
  }
  updateStats();
  requestAnimationFrame(tick);

  // Exposed for automated testing of the prototype
  window.__fw = { map, walkTo, setWalker, cells, get distanceM() { return distanceM; } };
})();
</script>
</body>
</html>
